# The download worker, for the home PC. It joins your Tailscale network and
# connects out to the cloud server, so nothing on the PC is opened to the internet.
#
#   cp deploy/worker/.env.example deploy/worker/.env      then fill it in
#   docker compose -f deploy/worker/compose.yaml up -d
#
# The worker runs the image CI publishes once every check passes on main, and the
# updater service keeps it on the newest one (docs/shipping-changes.md).
name: audiostash-worker

# The local driver rotates log files. Otherwise Docker keeps every log line forever
# and slowly fills the disk.
x-logging: &logging
  logging:
    driver: local

services:
  # Puts this compose project on your tailnet as the machine "audiostash-worker".
  tailscale:
    <<: *logging
    image: tailscale/tailscale:v1.104.4
    hostname: audiostash-worker
    environment:
      # Used on the first start only. The login is then kept in the tailscale volume.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      # Kernel networking, so the worker's ordinary connections go over Tailscale.
      # In the default userspace mode only proxied connections would.
      TS_USERSPACE: "false"
    volumes: [tailscale:/var/lib/tailscale]
    devices: ["/dev/net/tun:/dev/net/tun"]
    cap_add: [net_admin]
    restart: unless-stopped

  worker:
    <<: *logging
    image: ghcr.io/michaelchung888/audiostash-worker:latest
    # Shares the tailscale container's network, so its traffic to the server goes over Tailscale.
    network_mode: service:tailscale
    depends_on: [tailscale]
    environment:
      API_URL: ${API_URL:?set API_URL in deploy/worker/.env}
      RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL in deploy/worker/.env}
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN in deploy/worker/.env}
      WORKER_ID: audiostash-worker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # The worker waits up to 25 seconds for running jobs on shutdown. Docker's default is 10.
    stop_grace_period: 30s
    restart: unless-stopped

  # Every five minutes, downloads the worker image if a newer one is published, and
  # restarts the worker on it. Compose leaves the worker running when nothing changed.
  # Then it deletes the worker images that lost their tag to a newer one, and no others.
  updater:
    <<: *logging
    image: docker:29.9.3-cli
    # Runs Compose against this folder through Docker's socket. The socket gives full
    # control of Docker, so only this fixed command runs with it.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/worker:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          docker compose -f /worker/compose.yaml pull --quiet worker &&
            docker compose -f /worker/compose.yaml up -d --no-deps worker &&
            docker image prune -f --filter label=org.opencontainers.image.source=https://github.com/MichaelChung888/AudioStash
          sleep 300
        done
    restart: unless-stopped

volumes:
  tailscale:

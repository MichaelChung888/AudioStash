# The API, Postgres and RabbitMQ, for the cloud server. docs/deploy.md has the steps.
#
#   cp deploy/server/.env.example deploy/server/.env      then fill it in
#   docker compose -f deploy/server/compose.yaml up -d --build
#
# Every published port is bound to 127.0.0.1. Docker writes its own firewall rules for
# published ports, so a port on 0.0.0.0 would be open to the internet even with a host
# firewall. Tailscale passes the API and RabbitMQ on from localhost instead (docs/deploy.md).
name: audiostash-server

x-api-image: &api-image
  image: audiostash-api
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile

# The local driver rotates log files. Otherwise Docker keeps every log line forever
# and slowly fills the disk.
x-logging: &logging
  logging:
    driver: local

services:
  postgres:
    <<: *logging
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: audiostash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/server/.env}
      POSTGRES_DB: audiostash
    # No published port: only the API reaches it, over the Compose network.
    # Postgres 18 images keep their data in a versioned folder under /var/lib/postgresql.
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audiostash -d audiostash"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    <<: *logging
    image: rabbitmq:4.4.0-management-alpine
    # RabbitMQ names its data folder after the hostname. A fixed one keeps the
    # queues when the container is recreated.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: audiostash
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in deploy/server/.env}
    # 5672 for the worker, through `tailscale serve`. 15672 is the management web UI,
    # reached through an SSH tunnel (docs/deploy.md).
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: [rabbitmq:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # Runs the new migrations, then exits. The API starts only after it succeeds.
  migrate:
    <<: [*api-image, *logging]
    command: ["node", "packages/db/scripts/migrate.ts"]
    environment:
      DATABASE_URL: postgres://audiostash:${POSTGRES_PASSWORD}@postgres:5432/audiostash
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: [*api-image, *logging]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://audiostash:${POSTGRES_PASSWORD}@postgres:5432/audiostash
      RABBITMQ_URL: amqp://audiostash:${RABBITMQ_PASSWORD}@rabbitmq:5672
    # For `tailscale funnel` (the phone) and `tailscale serve` (the worker).
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres:
  rabbitmq:
